<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        // Ensure window.fetch has both getter and setter to prevent "Cannot set property fetch of #<Window> which has only a getter"
        try {
          var originalFetch = window.fetch;
          var currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(newFetch) {
              currentFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            var proto = Object.getPrototypeOf(window);
            if (proto) {
              var protoFetch = proto.fetch;
              Object.defineProperty(proto, 'fetch', {
                get: function() {
                  return protoFetch;
                },
                set: function(newFetch) {
                  protoFetch = newFetch;
                },
                configurable: true,
                enumerable: true
              });
            }
          } catch (err) {}
        }

        // Safety handler to suppress any stray unhandled errors from external/injected scripts attempting to reassign fetch
        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.indexOf('fetch') !== -1 && event.message.indexOf('getter') !== -1) {
            if (typeof event.preventDefault === 'function') {
              event.preventDefault();
            }
            return true;
          }
        }, true);
      })();
    </script>
